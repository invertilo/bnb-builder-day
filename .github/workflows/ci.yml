name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bot:
    name: Bot (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  studio:
    name: Agente de BNB Agent Studio (compila con Primera Acción)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/studio-sync.mjs
      - run: corepack enable
      - name: Instalar dependencias del workspace
        working-directory: studio
        run: pnpm install --frozen-lockfile
      - name: Typecheck del agente
        working-directory: studio/app/agent
        run: pnpm exec tsc -p tsconfig.json --noEmit
